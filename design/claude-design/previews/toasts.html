<!doctype html><html><head><meta charset="utf-8">
<title>Toasts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{--base:#0B1628;--raised:#121E2E;--sunken:#07101C;--border:#2A3A55;
    --bsub:rgba(255, 255, 255, 0.05);--t1:#F5F7FA;--t2:#8B94A5;--t3:#3B4A68;--acc:#FF6A00;--acch:#FF8533;
    --accp:#CC5500;--ok:#4caf50;--warn:#ffaa00;--err:#ff4444;--info:#00D9FF;
    --chartbg:#0D1624;--frost:rgba(11, 22, 40, 0.78);--frostb:rgba(255, 255, 255, 0.08);--glow:rgba(255, 106, 0, 0.4);
    --mono:'JetBrains Mono',Consolas,monospace;
    --sans:Inter,Roboto,'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--base);color:var(--t1);font:400 14px/1.55 var(--sans);
    padding:22px;-webkit-font-smoothing:antialiased}
  h1{font:700 16px/1.2 var(--sans);margin-bottom:2px}
  .sub{font:400 11px/1.5 var(--mono);color:var(--t3);margin-bottom:16px}
  .lbl{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--t3);margin:16px 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style></head><body>
<h1>Toasts</h1><div class="sub">INFO · WARNING · ERROR · CRITICAL — real app messages · frame 33</div>
<div style="display:flex;flex-direction:column;gap:8px;max-width:460px"><div style="font:500 12.5px/1.4 var(--sans);border:1px solid var(--info);background:rgba(11,40,60,.92);border-radius:4px;padding:10px 14px">Scanner found 2 new demos</div><div style="font:500 12.5px/1.4 var(--sans);border:1px solid var(--warn);background:rgba(80,60,10,.92);border-radius:4px;padding:10px 14px">Hopfield bypassed — 2 fwd passes needed</div><div style="font:500 12.5px/1.4 var(--sans);border:1px solid var(--err);background:rgba(80,20,20,.92);border-radius:4px;padding:10px 14px">Demo &lt; 10MB (DS-12 violation)</div><div style="font:500 12.5px/1.4 var(--sans);border:1px solid #ff0000;background:rgba(100,10,10,.94);border-radius:4px;padding:10px 14px">DataQualityError · NaN &gt; 5% batch</div></div>
</body></html>
