<!doctype html><html><head><meta charset="utf-8">
<title>Three themes, one contract</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{--base:#0B1628;--raised:#121E2E;--sunken:#07101C;--border:#2A3A55;
    --bsub:rgba(255, 255, 255, 0.05);--t1:#F5F7FA;--t2:#8B94A5;--t3:#3B4A68;--acc:#FF6A00;--acch:#FF8533;
    --accp:#CC5500;--ok:#4caf50;--warn:#ffaa00;--err:#ff4444;--info:#00D9FF;
    --chartbg:#0D1624;--frost:rgba(11, 22, 40, 0.78);--frostb:rgba(255, 255, 255, 0.08);--glow:rgba(255, 106, 0, 0.4);
    --mono:'JetBrains Mono',Consolas,monospace;
    --sans:Inter,Roboto,'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--base);color:var(--t1);font:400 14px/1.55 var(--sans);
    padding:22px;-webkit-font-smoothing:antialiased}
  h1{font:700 16px/1.2 var(--sans);margin-bottom:2px}
  .sub{font:400 11px/1.5 var(--mono);color:var(--t3);margin-bottom:16px}
  .lbl{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--t3);margin:16px 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style></head><body>
<h1>Three themes, one contract</h1><div class="sub">theme.cs2 / theme.csgo / theme.cs16 · frame 32</div>
<div class="lbl">CS2</div><table style="border-collapse:collapse;width:100%;border:1px solid var(--bsub)"><tr><td style="background:#0B1628;height:40px;min-width:70px"></td><td style="background:#121E2E;height:40px;min-width:70px"></td><td style="background:#FF6A00;height:40px;min-width:70px"></td><td style="background:#F5F7FA;height:40px;min-width:70px"></td><td style="background:#00D9FF;height:40px;min-width:70px"></td></tr></table><div style="font:400 10.5px/1.6 var(--mono);color:var(--t2);margin-top:4px">base #0B1628 · accent #FF6A00 · info #00D9FF</div><div class="lbl">CSGO</div><table style="border-collapse:collapse;width:100%;border:1px solid var(--bsub)"><tr><td style="background:#1a1c21;height:40px;min-width:70px"></td><td style="background:#1c1e24;height:40px;min-width:70px"></td><td style="background:#617d8c;height:40px;min-width:70px"></td><td style="background:#dcdcdc;height:40px;min-width:70px"></td><td style="background:#617d8c;height:40px;min-width:70px"></td></tr></table><div style="font:400 10.5px/1.6 var(--mono);color:var(--t2);margin-top:4px">base #1a1c21 · accent #617d8c · info #617d8c</div><div class="lbl">CS1.6</div><table style="border-collapse:collapse;width:100%;border:1px solid var(--bsub)"><tr><td style="background:#121a12;height:40px;min-width:70px"></td><td style="background:#182418;height:40px;min-width:70px"></td><td style="background:#4db04f;height:40px;min-width:70px"></td><td style="background:#dcdcdc;height:40px;min-width:70px"></td><td style="background:#4db04f;height:40px;min-width:70px"></td></tr></table><div style="font:400 10.5px/1.6 var(--mono);color:var(--t2);margin-top:4px">base #121a12 · accent #4db04f · info #4db04f</div>
</body></html>
