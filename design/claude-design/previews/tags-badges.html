<!doctype html><html><head><meta charset="utf-8">
<title>Tags · StatBadge · ProgressRing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{--base:#0B1628;--raised:#121E2E;--sunken:#07101C;--border:#2A3A55;
    --bsub:rgba(255, 255, 255, 0.05);--t1:#F5F7FA;--t2:#8B94A5;--t3:#3B4A68;--acc:#FF6A00;--acch:#FF8533;
    --accp:#CC5500;--ok:#4caf50;--warn:#ffaa00;--err:#ff4444;--info:#00D9FF;
    --chartbg:#0D1624;--frost:rgba(11, 22, 40, 0.78);--frostb:rgba(255, 255, 255, 0.08);--glow:rgba(255, 106, 0, 0.4);
    --mono:'JetBrains Mono',Consolas,monospace;
    --sans:Inter,Roboto,'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--base);color:var(--t1);font:400 14px/1.55 var(--sans);
    padding:22px;-webkit-font-smoothing:antialiased}
  h1{font:700 16px/1.2 var(--sans);margin-bottom:2px}
  .sub{font:400 11px/1.5 var(--mono);color:var(--t3);margin-bottom:16px}
  .lbl{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--t3);margin:16px 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  .tag{font:700 10px/1 var(--mono);letter-spacing:.1em;border-radius:999px;padding:5px 10px}
  .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
    font:700 13px/1 var(--sans);position:relative}
  .badge{font:700 13px/1 var(--sans);border-radius:4px;padding:8px 10px}
</style></head><body>
<h1>Tags · StatBadge · ProgressRing</h1><div class="sub">rating_color / rating_label · theme_engine.py · frame 33</div>
<div class="lbl">Tags</div><div class="row"><span class="tag" style="background:rgba(255,106,0,.15);color:var(--acc);border:1px solid rgba(255,106,0,.3)">PRO</span><span class="tag" style="background:rgba(255,106,0,.15);color:var(--acc)">T-SIDE</span><span class="tag" style="background:rgba(0,217,255,.12);color:var(--info)">CT-SIDE</span></div><div class="lbl">StatBadge · rating_color(value) + rating_label(value)</div><div class="row"><span class="badge" style="background:rgba(76,175,80,.15);color:var(--ok)">1.28 · EXCELLENT ≥1.30↑</span><span class="badge" style="background:rgba(255,170,0,.15);color:var(--warn)">0.97 · STABLE 0.90–1.10</span><span class="badge" style="background:rgba(255,68,68,.15);color:var(--err)">0.84 · WEAK &lt;0.90</span></div><div class="lbl">ProgressRing · thick 8 · starts 12 o&#39;clock</div><div class="row"><div class="ring" style="background:conic-gradient(var(--acc) 263deg, var(--sunken) 0)"><span style="background:var(--base);width:48px;height:48px;border-radius:50%;display:grid;place-items:center">73%</span></div><div class="ring" style="background:conic-gradient(var(--info) 162deg, var(--sunken) 0)"><span style="background:var(--base);width:48px;height:48px;border-radius:50%;display:grid;place-items:center">45%</span></div><div class="ring" style="background:conic-gradient(var(--ok) 101deg, var(--sunken) 0)"><span style="background:var(--base);width:48px;height:48px;border-radius:50%;display:grid;place-items:center">28%</span></div></div>
</body></html>
