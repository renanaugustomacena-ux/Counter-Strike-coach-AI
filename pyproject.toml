# pyproject.toml — Macena CS2 Analyzer
# Unified tool configuration. Source of truth for tool behavior.
# Pre-commit hooks (.pre-commit-config.yaml) must align with these values.

# P5-04: Standard build configuration for proper Python packaging
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macena-cs2-analyzer"
version = "1.0.0"
description = "AI-powered Counter-Strike 2 coaching and analysis platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[project.optional-dependencies]
rap = ["ncps>=1.0", "hflayers>=0.1"]

[tool.setuptools.packages.find]
include = ["Programma_CS2_RENAN*"]

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    external_analysis
  | dist
  | \.venv
  | venv.*
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["external_analysis/*", "dist/*", ".venv/*", "venv*/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
    "external_analysis/",
    "dist/",
    "\\.venv/",
    "tests/",
]

[tool.coverage.run]
source = ["Programma_CS2_RENAN"]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/external_analysis/*",
    # Dev/CLI tools — not production code, don't inflate coverage denominator
    "*/tools/*",
    # Entry-point scripts (thin wrappers, tested via integration)
    "*/run_ingestion.py",
    "*/run_worker.py",
    "*/run_build.py",
    "*/main.py",
]

[tool.coverage.report]
# P6-01: Incremental coverage roadmap
# Exclusions updated: dev tools, legacy Kivy UI, entry-point scripts
# omitted from denominator for honest production coverage measurement.
# Kept in sync with the CI gate (build.yml: pytest --cov-fail-under=33).
# Raise BOTH together when the suite sustainably clears a higher bar.
fail_under = 50  # W4: raised from 33 (suite sits at ~55.8%); keep in sync with build.yml
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

# W4b: ruff — curated starter ruleset (course-22 §Pre-commit candidates).
# E/F = pycodestyle+pyflakes core; B = bugbear (real bug patterns);
# I is OFF (isort owns imports); UP/SIM/DTZ etc. are the NEXT ratchet
# steps — enable one family per commit with its own autofix sweep.
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["external_analysis", "dist", ".venv", "venv*", "docs", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E731",  # lambda assignments — used deliberately for Qt slots
    "B008",  # function call in default — argparse Path defaults
    "B905",  # zip strict — py<3.10 style retained in places
    "E402",  # module-import-not-at-top — the house sys.path-bootstrap pattern
    "E712",  # == True/False — SQLModel/SQLAlchemy filter expressions REQUIRE it
    # NEXT ratchet steps (enable one per commit with its own sweep):
    # F841 unused-variable, B007 unused-loop-var, B904 raise-from,
    # E741 ambiguous-name, B023 loop-capture, then UP/SIM/DTZ families.
    "F841",
    "B007",
    "B904",
    "E741",
    "B023",
    "B027",
    "B017",
    "F811",
    "E721",
    "B005",
    "B024",
    "B028",
    "B009",
    "B033",
]
